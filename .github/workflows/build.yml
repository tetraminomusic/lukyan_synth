name: Build CLAP and VST3 Plugins

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (CLAP + VST3)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compile CLAP Plugin & Tests
        run: cmake --build build --config Release

      - name: Run Golden Tests (x86-64 AVX2 Verification)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Clone and Build clap-wrapper
        run: |
          git clone --recursive https://github.com/free-audio/clap-wrapper.git
          cd clap-wrapper
          cmake -B build -DCLAP_WRAPPER_DOWNLOAD_DEPENDENCIES=TRUE
          cmake --build build --config Release
          cd ..

      - name: Package VST3 Plugin
        shell: bash
        run: |
          WRAPPER_FILE=$(find clap-wrapper/build -type f \( -name "clapasvst3.vst3" -o -name "clapasvst3.dll" -o -name "clapasvst3" \) | head -n 1)
          echo "Found wrapper binary at: $WRAPPER_FILE"
          
          mkdir -p "build/Release/Lukyan Synth.vst3/Contents/x86_64-win"
          mkdir -p "build/Release/Lukyan Synth.vst3/Contents/Resources"
          
          cp "$WRAPPER_FILE" "build/Release/Lukyan Synth.vst3/Contents/x86_64-win/Lukyan Synth.vst3"
          cp "build/Release/Lukyan Synth.clap" "build/Release/Lukyan Synth.vst3/Contents/Resources/"

      - name: Zip Windows Plugins
        shell: bash
        run: |
          cd build/Release
          7z a ../../Lukyan-Synth-Windows.zip "Lukyan Synth.clap" "Lukyan Synth.vst3"

      - name: Upload Windows Plugins (CLAP + VST3)
        uses: actions/upload-artifact@v4
        with:
          name: Lukyan-Synth-Windows-Complete
          path: Lukyan-Synth-Windows.zip

  build-macos:
    name: Build macOS (Bundle)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compile Plugin & Tests
        run: cmake --build build --config Release

      - name: Run Golden Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Zip macOS Plugin
        run: |
          cd build
          zip -r ../Lukyan-Synth-macOS.zip "Lukyan Synth.clap"

      - name: Upload macOS Plugin
        uses: actions/upload-artifact@v4
        with:
          name: Lukyan-Synth-macOS
          path: Lukyan-Synth-macOS.zip

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
