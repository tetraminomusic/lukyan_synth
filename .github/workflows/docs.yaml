name: Generate and Deploy Documentation

on:
  push:
    branches: [ main, master ]
    paths:
      - 'include/**'
      - 'src/**'
      - 'Doxyfile'
      - '.github/workflows/documentation.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Verify workspace and create output directory
        run: |
          pwd
          ls -la
          mkdir -p docs/doxygen
          ls -la docs/

      - name: Generate Documentation
        run: |
          doxygen Doxyfile 2>&1 | grep -v "warning: ignoring unsupported tag" || true

      - name: Verify documentation was generated
        run: |
          ls -la docs/doxygen/
          test -f docs/doxygen/html/index.html && echo "index.html exists!" || (echo "index.html NOT found" && exit 1)

      - name: Add .nojekyll file
        run: touch docs/doxygen/html/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/doxygen/html

  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4